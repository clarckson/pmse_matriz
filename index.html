<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Matriz de Atividades - PMSE</title>
    <link rel="icon" type="image/png" href="https://intranet.pm.se.gov.br/portal/images/favicon.png">
    <style>
        /* Tira as margens e barras de rolagem da janela externa */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b1120; /* Fundo escuro enquanto o app carrega */
        }
        /* Faz o iframe ocupar exatamente 100% da tela visível */
        iframe {
                display: block;
                width: 100vw;
                height: 100%;
                min-height: 100dvh; /* dvh adapta-se dinamicamente quando a barra de endereços do Chrome móvel aparece ou some */
                border: none;
            }
    </style>
</head>
<body>
    <iframe 
        src="https://matriz-de-atividades-pmse.ai.studio/"
        allow="geolocation; autoplay; camera; microphone; clipboard-write; fullscreen; display-capture"
        allowfullscreen="true"
        webkitallowfullscreen="true"
        mozallowfullscreen="true">
    </iframe>
</body>
</html>
